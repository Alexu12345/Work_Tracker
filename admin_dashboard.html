<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title data-key="adminDashboardTitle">
        لوحة تحكم المدير
    </title>

    <link rel="stylesheet" href="admin_dashboard.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        /*
         * إخفاء لوحة التحكم قبل إدخال كلمة المرور
         */
        [hidden] {
            display: none !important;
        }

        body.is-locked {
            overflow: hidden;
        }

        /*
         * نافذة كلمة المرور
         */
        #passwordGate {
            position: fixed;
            inset: 0;
            z-index: 999999;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.88);
        }

        .password-box {
            width: min(100%, 380px);
            padding: 30px;
            border-radius: 14px;
            background: #ffffff;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.45);
            text-align: right;
        }

        .password-box h2 {
            margin: 0 0 24px;
            color: #007bff;
            text-align: center;
        }

        .password-box label {
            display: block;
            margin-bottom: 8px;
            color: #333333;
            font-weight: bold;
        }

        .password-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 16px;
            border: 1px solid #bbbbbb;
            border-radius: 8px;
            outline: none;
            font-size: 17px;
            direction: ltr;
            text-align: left;
        }

        .password-box input:focus {
            border-color: #007bff;
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.2);
        }

        .password-box button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: #ffffff;
            cursor: pointer;
            font-size: 17px;
        }

        .password-box button:hover {
            background: #0056b3;
        }

        .password-box button:disabled {
            cursor: wait;
            opacity: 0.7;
        }

        #passwordError {
            min-height: 24px;
            margin: 14px 0 0;
            color: #dc3545;
            font-weight: bold;
            text-align: center;
        }

        /*
         * لا تظهر لوحة التحكم قبل فتحها
         */
        body.is-locked #protectedContent {
            display: none !important;
        }

        body.is-unlocked #protectedContent {
            display: block;
        }

        /*
         * تنسيق النافذة في الوضع الليلي
         */
        body.dark-mode #passwordGate {
            background: rgba(0, 0, 0, 0.92);
        }

        body.dark-mode .password-box {
            background: #1e1e1e;
            color: #e0e0e0;
        }

        body.dark-mode .password-box h2 {
            color: #00e6e6;
        }

        body.dark-mode .password-box label {
            color: #e0e0e0;
        }

        body.dark-mode .password-box input {
            background: #2a2a2a;
            border-color: #555555;
            color: #ffffff;
        }
    </style>
</head>

<body class="is-locked">

    <!-- نافذة كلمة المرور الإجبارية -->
    <div id="passwordGate"
         role="dialog"
         aria-modal="true"
         aria-labelledby="passwordTitle">

        <form id="passwordForm" class="password-box">
            <h2 id="passwordTitle">
                تسجيل الدخول
            </h2>

            <label for="passwordInput">
                أدخل كلمة المرور
            </label>

            <input
                id="passwordInput"
                type="password"
                autocomplete="current-password"
                required
                autofocus>

            <button id="passwordButton" type="submit">
                موافق
            </button>

            <p id="passwordError"
               role="alert"
               aria-live="polite">
            </p>
        </form>
    </div>

    <!-- محتوى لوحة التحكم -->
    <div id="protectedContent" hidden>

        <!-- Loading Indicator -->
        <div id="loadingIndicator"
             class="loading-indicator"
             style="display: none;">

            <div class="spinner"></div>
        </div>

        <!-- Toast Message -->
        <div id="toastMessage"
             class="toast-message"
             style="display: none;">
        </div>

        <!-- Language Switcher -->
        <div class="lang-switcher">
            <button id="langArBtn"
                    class="lang-btn active"
                    type="button">

                العربية
            </button>

            <button id="langEnBtn"
                    class="lang-btn"
                    type="button">

                English
            </button>
        </div>

        <!-- Dark Mode Toggle -->
        <button id="darkModeToggle"
                class="dark-mode-toggle"
                type="button"
                aria-label="تبديل الوضع الليلي">

            <i class="fas fa-moon"></i>
        </button>

        <div class="dashboard-container page">

            <h1 data-key="adminDashboardTitle">
                لوحة تحكم المدير
            </h1>

            <!-- Filter Controls -->
            <div class="filter-controls">

                <label for="filterType"
                       data-key="filterBy">

                    تصفية حسب:
                </label>

                <select id="filterType">
                    <option value="all"
                            data-key="allTime">

                        جميع الأوقات
                    </option>

                    <option value="day"
                            data-key="specificDay">

                        يوم معين
                    </option>

                    <option value="week"
                            data-key="specificWeek">

                        أسبوع معين
                    </option>

                    <option value="month"
                            data-key="specificMonth">

                        شهر معين
                    </option>

                    <option value="custom"
                            data-key="customRange">

                        نطاق مخصص
                    </option>
                </select>

                <div id="dateFilter"
                     class="filter-input-group"
                     style="display: none;">

                    <label for="filterDate"
                           data-key="selectDate">

                        اختر تاريخ:
                    </label>

                    <input type="date"
                           id="filterDate">
                </div>

                <div id="weekFilter"
                     class="filter-input-group"
                     style="display: none;">

                    <label for="filterWeek"
                           data-key="selectWeek">

                        اختر أسبوع:
                    </label>

                    <input type="week"
                           id="filterWeek">
                </div>

                <div id="monthFilter"
                     class="filter-input-group"
                     style="display: none;">

                    <label for="filterMonth"
                           data-key="selectMonth">

                        اختر شهر:
                    </label>

                    <input type="month"
                           id="filterMonth">
                </div>

                <div id="customFilter"
                     class="filter-input-group"
                     style="display: none;">

                    <label for="filterStartDate"
                           data-key="startDate">

                        تاريخ البدء:
                    </label>

                    <input type="date"
                           id="filterStartDate">

                    <label for="filterEndDate"
                           data-key="endDate">

                        تاريخ الانتهاء:
                    </label>

                    <input type="date"
                           id="filterEndDate">
                </div>

                <button id="applyFilterBtn"
                        type="button"
                        data-key="applyFilter">

                    تطبيق التصفية
                </button>
            </div>

            <div class="dashboard-content">

                <!-- Main Performance Chart -->
                <div class="chart-section">
                    <div class="chart-container">
                        <canvas id="performanceChart"></canvas>
                    </div>
                </div>

                <!-- Top 3 Employees Section -->
                <div class="top-employees-section">

                    <h2 data-key="topEmployeesTitle">
                        أفضل 3 موظفين
                    </h2>

                    <div class="ladder-container">
                        <!-- سيتم إنشاء البيانات تلقائيًا -->
                    </div>
                </div>

                <!-- Account Performance Chart -->
                <div class="chart-section account-chart-section">
                    <div class="chart-container">
                        <canvas id="accountPerformanceChart"></canvas>
                    </div>
                </div>

                <!-- Account Performance Table -->
                <div class="table-section account-table-section">

                    <h2 data-key="accountSummaryTableTitle">
                        ملخص أداء الحسابات
                    </h2>

                    <div class="table-responsive">
                        <table id="accountSummaryTable">

                            <thead>
                                <tr>
                                    <th data-key="accountNameHeader">
                                        اسم الحساب
                                    </th>

                                    <th data-key="totalHoursHeader">
                                        إجمالي الساعات
                                    </th>
                                </tr>
                            </thead>

                            <tbody>
                                <!-- سيتم إنشاء بيانات الحسابات تلقائيًا -->
                            </tbody>
                        </table>
                    </div>

                    <p id="noAccountDataMessage"
                       class="no-data-message"
                       style="display: none;">
                    </p>
                </div>
            </div>

            <button id="backToAdminPanelBtn"
                    class="back-btn"
                    type="button"
                    data-key="backToAdminPanel">

                رجوع للوحة تحكم المدير
            </button>
        </div>
    </div>

    <!-- كود الحماية وتحميل ملفات لوحة التحكم -->
    <script>
        /*
         * كلمة المرور
         */
        const PAGE_PASSWORD = '11223344';

        const passwordGate =
            document.getElementById('passwordGate');

        const passwordForm =
            document.getElementById('passwordForm');

        const passwordInput =
            document.getElementById('passwordInput');

        const passwordButton =
            document.getElementById('passwordButton');

        const passwordError =
            document.getElementById('passwordError');

        const protectedContent =
            document.getElementById('protectedContent');

        /*
         * تحميل ملف JavaScript عادي
         */
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');

                script.src = src;
                script.onload = resolve;
                script.onerror = reject;

                document.body.appendChild(script);
            });
        }

        /*
         * تحميل ملف JavaScript من نوع module
         */
        function loadModule(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');

                script.src = src;
                script.type = 'module';

                script.onload = resolve;
                script.onerror = reject;

                document.body.appendChild(script);
            });
        }

        passwordForm.addEventListener(
            'submit',
            async function (event) {
                event.preventDefault();

                passwordError.textContent = '';

                if (passwordInput.value !== PAGE_PASSWORD) {
                    passwordError.textContent =
                        'كلمة المرور غير صحيحة، أعد كتابتها.';

                    passwordInput.value = '';
                    passwordInput.focus();

                    return;
                }

                passwordButton.disabled = true;
                passwordButton.textContent =
                    'جاري فتح الصفحة...';

                try {
                    /*
                     * إظهار محتوى لوحة التحكم
                     */
                    protectedContent.hidden = false;

                    document.body.classList.remove('is-locked');
                    document.body.classList.add('is-unlocked');

                    /*
                     * إزالة نافذة كلمة المرور
                     */
                    passwordGate.remove();

                    /*
                     * تحميل Chart.js بعد كلمة المرور
                     */
                    await loadScript(
                        'https://cdn.jsdelivr.net/npm/chart.js'
                    );

                    /*
                     * تحميل admin_dashboard.js بعد Chart.js
                     */
                    await loadModule('admin_dashboard.js');

                    /*
                     * ملف admin_dashboard.js الحالي
                     * يحتوي على DOMContentLoaded.
                     * يتم تشغيل الحدث بعد تحميله.
                     */
                    document.dispatchEvent(
                        new Event('DOMContentLoaded')
                    );

                } catch (error) {
                    console.error(
                        'Error loading dashboard:',
                        error
                    );

                    document.body.classList.add('is-locked');
                    document.body.classList.remove('is-unlocked');

                    protectedContent.hidden = true;

                    passwordError.textContent =
                        'حدث خطأ أثناء تحميل لوحة التحكم.';

                    passwordButton.disabled = false;
                    passwordButton.textContent = 'موافق';

                    if (!document.body.contains(passwordGate)) {
                        document.body.appendChild(passwordGate);
                    }

                    passwordInput.focus();
                }
            }
        );

        /*
         * منع زر Escape من تجاوز النافذة
         */
        document.addEventListener(
            'keydown',
            function (event) {
                if (
                    event.key === 'Escape' &&
                    document.body.classList.contains('is-locked')
                ) {
                    event.preventDefault();
                }
            }
        );

        /*
         * منع النقر خارج النافذة من إغلاقها
         */
        passwordGate.addEventListener(
            'click',
            function (event) {
                if (event.target === passwordGate) {
                    event.preventDefault();
                    passwordInput.focus();
                }
            }
        );
    </script>
</body>

</html>
